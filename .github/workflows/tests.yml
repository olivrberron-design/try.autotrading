name: Python offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python modules
        run: python -m compileall -q autotrading tests analyze.py backtest.py demo_smoke_test.py
      - name: Run offline unit tests (no keys / no orders)
        run: python -m unittest discover -s tests -v
